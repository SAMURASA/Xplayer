<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>Listen in XPlayer</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Segoe UI, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at top, #282a43 0%, #111318 54%); color: #f5f5fa; }
    main { width: min(92vw, 520px); padding: 34px; border: 1px solid #ffffff1b; border-radius: 22px; background: #171920e8; box-shadow: 0 24px 80px #0007; text-align: center; }
    .mark { margin: 0 auto 18px; display: grid; place-items: center; width: 58px; height: 58px; border-radius: 18px; background: linear-gradient(135deg,#9a5bff,#4c83ff); font-size: 27px; font-weight: 800; }
    h1 { font-size: 25px; margin: 0 0 10px; }
    p { color: #bfc2d2; line-height: 1.6; margin: 0 auto 22px; }
    .track { font-size: 13px; color: #9096ab; margin: -8px 0 20px; overflow-wrap: anywhere; }
    a { display: block; margin-top: 10px; padding: 13px 16px; border-radius: 12px; text-decoration: none; font-weight: 700; }
    .primary { color: white; background: linear-gradient(100deg,#8b5cf6,#4f73ff); }
    .secondary { color: #e2e4ed; border: 1px solid #ffffff24; background: #ffffff08; }
    small { display: block; color: #858a9e; margin-top: 18px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="mark">X</div>
    <h1>Opening XPlayer</h1>
    <p id="message">Trying to open the shared track in XPlayer at the same playback position…</p>
    <div class="track" id="track"></div>
    <a class="primary" id="open" href="#">Open in XPlayer</a>
    <a class="secondary" id="download" href="https://github.com/SAMURASA/Xplayer/releases">Download XPlayer on GitHub</a>
    <small>If XPlayer is already installed, allow your browser to open the app. If it is not installed, the page will take you to GitHub Releases.</small>
  </main>
  <script>
    (() => {
      const RELEASES = "https://github.com/SAMURASA/Xplayer/releases";
      const params = new URLSearchParams(location.search);
      const videoId = String(params.get("v") || params.get("videoId") || "").trim();
      const basePosition = Number(params.get("t") || 0);
      const updatedAt = Number(params.get("at") || Date.now());
      const paused = params.get("p") === "1";
      const rateValue = Number(params.get("r") || 1);
      const rate = Number.isFinite(rateValue) && rateValue > 0 ? Math.min(4, rateValue) : 1;
      const valid = /^[A-Za-z0-9_-]{11}$/.test(videoId);
      const position = Number.isFinite(basePosition)
        ? Math.max(0, Math.min(86400, basePosition + (!paused ? Math.max(0, Date.now() - updatedAt) / 1000 * rate : 0)))
        : 0;
      const deepLink = valid ? `xplayer://listen?videoId=${encodeURIComponent(videoId)}&t=${encodeURIComponent(String(position))}` : "";
      const open = document.getElementById("open");
      const message = document.getElementById("message");
      document.getElementById("track").textContent = valid
        ? `YouTube video ${videoId} · ${Math.floor(position)}s`
        : "No valid YouTube track was found in this link.";
      document.getElementById("download").href = RELEASES;
      open.href = deepLink || RELEASES;
      if (!valid) {
        message.textContent = "This Listen link is invalid. Opening XPlayer’s GitHub Releases instead.";
        setTimeout(() => { location.replace(RELEASES); }, 650);
        return;
      }
      let leftPage = false;
      let launchAttempted = false;
      const markLaunch = () => { leftPage = true; clearTimeout(fallbackTimer); };
      window.addEventListener("pagehide", markLaunch, { once: true });
      document.addEventListener("visibilitychange", () => { if (document.hidden) markLaunch(); });
      open.addEventListener("click", event => {
        event.preventDefault();
        if (launchAttempted) return;
        launchAttempted = true;
        message.textContent = "Trying to hand the track to XPlayer. If no app opens, GitHub Releases is below.";
        location.href = deepLink;
      });
      // Try launching directly when opened from the Discord activity button.
      // Browsers that block the external protocol still leave a visible fallback.
      const fallbackTimer = setTimeout(() => {
        if (leftPage) return;
        if (document.hasFocus()) {
          message.textContent = "XPlayer was not detected. Redirecting to GitHub Releases…";
          location.replace(RELEASES);
        } else {
          // The external-app handoff likely moved focus to XPlayer or a browser
          // permission prompt. Do not interrupt that handoff with a second redirect.
          message.textContent = "If XPlayer did not open, return here and use the GitHub Releases link.";
        }
      }, 2200);
      try { location.href = deepLink; } catch (_) {
        clearTimeout(fallbackTimer);
        message.textContent = "XPlayer could not be opened automatically. Use the button below or download it from GitHub.";
      }
    })();
  </script>
</body>
</html>
